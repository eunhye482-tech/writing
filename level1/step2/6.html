<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "slave", ko: "노예" },
      { en: "stand", ko: "참다, 견디다" },
      { en: "degree", ko: "(온도, 각도의)도, 정도" },
      { en: "compete", ko: "경쟁하다" },
      { en: "competitive", ko: "경쟁적인" },
      { en: "competition", ko: "대회, 경쟁, 경기" },
      { en: "recycle", ko: "재활용하다" },
      { en: "right", ko: "권리" },
      { en: "suck", ko: "빨아 먹다, 흡수하다" },
      { en: "suburb", ko: "교외, 지역" },

      { en: "handle", ko: "다루다, 처리하다" },
      { en: "spice", ko: "향신료" },
      { en: "stomach", ko: "위, 복부" },
      { en: "regular", ko: "규칙적인" },
      { en: "folk", ko: "사람들, 민속의" },
      { en: "horrible", ko: "끔찍한" },
      { en: "spoil", ko: "망치다" },
      { en: "vegetable", ko: "채소" },
      { en: "usually", ko: "보통" },
      { en: "boast", ko: "자랑하다, 뽐내다" },

      { en: "unfair", ko: "부당한" },
      { en: "delight", ko: "기쁨" },
      { en: "tower", ko: "탑" },
      { en: "industry", ko: "산업" },
      { en: "industrial", ko: "산업의" },
      { en: "brand", ko: "상표" },
      { en: "apart", ko: "떨어져, 따로" },
      { en: "cinema", ko: "영화(관)" },
      { en: "lecture", ko: "강의" },
      { en: "thirsty", ko: "목마른" },

      { en: "stream", ko: "개울, 시내" },
      { en: "survival", ko: "생존" },
      { en: "oxygen", ko: "산소" },
      { en: "patient", ko: "인내심[참을성] 있는, 환자" },
      { en: "brand-new", ko: "완전 새 것인, 최신형의" },
      { en: "plain", ko: "쉬운, 분명한" },
      { en: "blood", ko: "혈액" },
      { en: "monk", ko: "스님, 수도승" },
      { en: "semester", ko: "학기" },
      { en: "struggle", ko: "애쓰다, 싸우다, 분투하다" },

      { en: "teenager", ko: "십대" },
      { en: "adopt", ko: "채택하다, 입양하다" },
      { en: "adapt", ko: "적응하다" },
      { en: "neat", ko: "깔끔한" },
      { en: "emotional", ko: "감정적인, 정서적인" },
      { en: "climate", ko: "기후, 분위기" },
      { en: "handshake", ko: "악수" },
      { en: "tiny", ko: "(아주) 작은" },
      { en: "link", ko: "연결하다" },
      { en: "bark", ko: "짖다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "greeting", ko: "인사(말)" },
      { en: "language", ko: "언어" },
      { en: "examine", ko: "조사하다" },
      { en: "secretary", ko: "비서" },
      { en: "palace", ko: "궁전" },
      { en: "even", ko: "심지어(~조차도), 훨씬" },
      { en: "total", ko: "전체의, 총계, 합계" },
      { en: "scholar", ko: "학자" },
      { en: "grain", ko: "알갱이" },
      { en: "Mars", ko: "화성" },

      { en: "soap", ko: "비누" },
      { en: "such", ko: "그런, 그러한" },
      { en: "unity", ko: "통합" },
      { en: "cancel", ko: "취소(하다)" },
      { en: "relative", ko: "친척, 상대적인, 비교적인" },
      { en: "usual", ko: "일상적인, 보통의" },
      { en: "owl", ko: "올빼미" },
      { en: "safety", ko: "안전" },
      { en: "row", ko: "줄, 열" },
      { en: "respond", ko: "(반)응[응답]하다" },

      { en: "tale", ko: "이야기" },
      { en: "rope", ko: "(밧)줄" },
      { en: "wide", ko: "넓은" },
      { en: "pile", ko: "더미, 쌓다" },
      { en: "trash", ko: "쓰레기" },
      { en: "shadow", ko: "그림자" },
      { en: "metal", ko: "금속" },
      { en: "symbol", ko: "상징" },
      { en: "diet", ko: "식단, 식사" },
      { en: "shelf", ko: "선반" },

      { en: "throw", ko: "던지다" },
      { en: "sheet", ko: "한 장" },
      { en: "square", ko: "정사각형, 광장" },
      { en: "volcano", ko: "화산" },
      { en: "servant", ko: "하인, 봉사자, 신하" },
      { en: "pet", ko: "애완 동물" },
      { en: "sculptor", ko: "조각가" },
      { en: "piece", ko: "작품" },
      { en: "target", ko: "목표(로 삼다), 목표물" },
      { en: "focus", ko: "집중하다[초점(을 두다)]" },

      { en: "passport", ko: "여권" },
      { en: "stick", ko: "막대기[지팡이], 찔러 넣다[찌르다]" },
      { en: "detailed", ko: "상세한, 자세한" },
      { en: "pour", ko: "붓다" },
      { en: "accident", ko: "사고" },
      { en: "riddle", ko: "수수께끼" },
      { en: "stadium", ko: "경기장" },
      { en: "pack", ko: "주머니[꾸러미, 배낭], 싸다[포장하다]" },
      { en: "sign", ko: "징후" },
      { en: "stare", ko: "응시하다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>

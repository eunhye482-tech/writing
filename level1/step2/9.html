<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "sunset", ko: "일몰, 해 질 녘" },
      { en: "aboard", ko: "타고(서)" },
      { en: "rub", ko: "문지르다" },
      { en: "various", ko: "다양한" },
      { en: "roar", ko: "으르렁거리다" },
      { en: "tie", ko: "묶다" },
      { en: "parade", ko: "행렬" },
      { en: "thrill", ko: "흥분(시키다)[전율(시키다)]" },
      { en: "tongue", ko: "혀, 말, 언어" },
      { en: "whistle", ko: "호각, 휘파람" },

      { en: "award", ko: "수여하다[(상을)주다, 상]" },
      { en: "trousers", ko: "바지" },
      { en: "toll", ko: "통행료, 요금" },
      { en: "afterward(s)", ko: "후에" },
      { en: "examination", ko: "시험" },
      { en: "blossom", ko: "꽃(피다)" },
      { en: "unselfish", ko: "사심 없는, 이기적이 아닌" },
      { en: "issue", ko: "쟁점, 문제" },
      { en: "athlete", ko: "운동선수" },
      { en: "vote", ko: "투표(하다)" },

      { en: "text", ko: "글, 본문, 문자" },
      { en: "firm", ko: "확고한, 단단한, 회사" },
      { en: "fright", ko: "공포" },
      { en: "sharp", ko: "날카로운" },
      { en: "crack", ko: "갈라지다, 틈, 금" },
      { en: "tend", ko: "경향이 있다" },
      { en: "worth", ko: "가치 있는" },
      { en: "bear", ko: "견디다, 참다, 낳다" },
      { en: "wealthy", ko: "부유한" },
      { en: "tend", ko: "경향이 있다" },

      { en: "proverb", ko: "속담" },
      { en: "conductor", ko: "지휘자" },
      { en: "gray", ko: "회색(의)" },
      { en: "warn", ko: "경고하다" },
      { en: "kindergarten", ko: "유치원" },
      { en: "landscape", ko: "풍경, 경치" },
      { en: "pity", ko: "연민" },
      { en: "scar", ko: "상처, 흉터" },
      { en: "track", ko: "(발)자국[흔적, 길, 궤도]" },
      { en: "mood", ko: "기분, 분위기" },

      { en: "gather", ko: "모이다, 모으다" },
      { en: "cure", ko: "치료(하다)" },
      { en: "public", ko: "공공(의)" },
      { en: "allow", ko: "허락하다" },
      { en: "chest", ko: "가슴" },
      { en: "speech", ko: "연설" },
      { en: "creature", ko: "생물, 창조물, 동물" },
      { en: "site", ko: "장소" },
      { en: "comb", ko: "빗(질하다)" },
      { en: "male", ko: "남성, 남자" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>

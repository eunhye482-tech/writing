<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "female", ko: "여성(의)" },
      { en: "entrance", ko: "입구" },
      { en: "project", ko: "과제" },
      { en: "communication", ko: "의사소통" },
      { en: "international", ko: "국제적인" },
      { en: "skip", ko: "거르다, 빼먹다" },
      { en: "single", ko: "단 하나의" },
      { en: "base", ko: "기초, 기본" },
      { en: "modern", ko: "현대의" },
      { en: "instead", ko: "(그)대신에" },

      { en: "flashlight", ko: "손전등" },
      { en: "completely", ko: "완전히" },
      { en: "fantastic", ko: "환상적인" },
      { en: "fiber", ko: "섬유(질)" },
      { en: "increase", ko: "증가하다" },
      { en: "planet", ko: "행성, 지구" },
      { en: "pronunciation", ko: "발음" },
      { en: "harvest", ko: "수확(하다)" },
      { en: "hunger", ko: "굶주림, 배고픔" },
      { en: "unique", ko: "독특한, 고유의" },

      { en: "arrest", ko: "체포하다" },
      { en: "tough", ko: "힘든" },
      { en: "feather", ko: "깃털" },
      { en: "port", ko: "항구" },
      { en: "govern", ko: "지배[통치]하다" },
      { en: "experience", ko: "경험" },
      { en: "grateful", ko: "감사하는" },
      { en: "slip", ko: "미끄러지다" },
      { en: "cost", ko: "비용" },
      { en: "rate", ko: "속도, 비율, 요금" },

      { en: "station", ko: "역" },
      { en: "background", ko: "배경" },
      { en: "branch", ko: "나뭇가지" },
      { en: "destroy", ko: "파괴하다" },
      { en: "please", ko: "기쁘게 하다" },
      { en: "ceremony", ko: "식, 의식" },
      { en: "hardly", ko: "거의~않다" },
      { en: "moreover", ko: "게다가" },
      { en: "topic", ko: "주제" },
      { en: "tax", ko: "세금" },

      { en: "protect", ko: "보호하다" },
      { en: "pulse", ko: "맥박" },
      { en: "wrap", ko: "포장하다" },
      { en: "truthful", ko: "진실한, 정직한" },
      { en: "develop", ko: "개발하다" },
      { en: "beyond", ko: "넘어서는" },
      { en: "delete", ko: "삭제하다" },
      { en: "closely", ko: "자세히, 면밀히, 가까이" },
      { en: "suffer", ko: "겪다, 고통받다, 고생하다" },
      { en: "pleasant", ko: "즐거운, 쾌적한" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>

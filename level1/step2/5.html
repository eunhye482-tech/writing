<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "stairs", ko: "계단" },
      { en: "level", ko: "정도, 수준" },
      { en: "stormy", ko: "폭풍이 치는, 폭풍의" },
      { en: "stripe", ko: "줄무늬" },
      { en: "revolution", ko: "혁명" },
      { en: "inner", ko: "내면의, 내부의, 안쪽의" },
      { en: "election", ko: "선거" },
      { en: "tear", ko: "눈물, 찢다" },
      { en: "block", ko: "막다" },
      { en: "global", ko: "지구의, 전세계적의" },

      { en: "ideal", ko: "이상적인" },
      { en: "entire", ko: "전체(의)" },
      { en: "tradition", ko: "전통" },
      { en: "steal", ko: "훔치다" },
      { en: "robber", ko: "강도" },
      { en: "necklace", ko: "목걸이" },
      { en: "credit", ko: "신용" },
      { en: "thankful", ko: "감사하는" },
      { en: "upset", ko: "뒤집다, 화나게 하다" },
      { en: "chat", ko: "잡담 하다, 수다 떨다" },

      { en: "court", ko: "법정, 법원" },
      { en: "truth", ko: "진실, 사실" },
      { en: "swing", ko: "흔들다" },
      { en: "snake", ko: "뱀" },
      { en: "terror", ko: "공포" },
      { en: "terrible", ko: "끔찍한" },
      { en: "loaf", ko: "덩어리" },
      { en: "view", ko: "견해, 바라보다" },
      { en: "gentle", ko: "온화한, 부드러운" },
      { en: "race", ko: "경주, 인종" },

      { en: "unification", ko: "통일, 통합" },
      { en: "religion", ko: "종교" },
      { en: "consume", ko: "소비[소모]하다" },
      { en: "limit", ko: "제한(하다)" },
      { en: "sink", ko: "가라앉다" },
      { en: "vision", ko: "전망[미래상, 상상]" },
      { en: "crime", ko: "범죄" },
      { en: "pork", ko: "돼지고기" },
      { en: "fierce", ko: "사나운" },
      { en: "social", ko: "사회적인" },

      { en: "continent", ko: "대륙" },
      { en: "gap", ko: "차이" },
      { en: "fund", ko: "기금" },
      { en: "dialogue", ko: "대화" },
      { en: "bowl", ko: "그릇" },
      { en: "blow", ko: "불다, 날려버리다" },
      { en: "miracle", ko: "기적" },
      { en: "spin", ko: "돌리다, 회전시키다" },
      { en: "search", ko: "찾다, 수색하다, 검색하다" },
      { en: "option", ko: "선택" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>

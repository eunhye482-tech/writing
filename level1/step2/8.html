<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "strange", ko: "낯선, 이상한" },
      { en: "sigh", ko: "한숨(을 쉬다)" },
      { en: "succeed", ko: "성공하다, 계승하다" },
      { en: "compare", ko: "비교[비유]하다" },
      { en: "devote", ko: "바치다, 헌신하다" },
      { en: "private", ko: "사적인" },
      { en: "step", ko: "걸음(마)" },
      { en: "liberty", ko: "자유" },
      { en: "thief", ko: "절도범, 도둑" },
      { en: "powder", ko: "가루" },

      { en: "passion", ko: "열정" },
      { en: "classic", ko: "전형[대표, 고전]적인" },
      { en: "mayor", ko: "시장" },
      { en: "source", ko: "원천, 출처, 원인" },
      { en: "erase", ko: "지우다" },
      { en: "prize", ko: "상" },
      { en: "invade", ko: "침략[침입, 침해]하다" },
      { en: "erase", ko: "지우다" },
      { en: "prize", ko: "상주다" },
      { en: "function", ko: "기능" },

      { en: "method", ko: "방법" },
      { en: "comedy", ko: "희극" },
      { en: "foreign", ko: "외국의" },
      { en: "duty", ko: "의무" },
      { en: "canal", ko: "수로, 운하" },
      { en: "determine", ko: "결정[결심]하다" },
      { en: "garbage", ko: "쓰레기" },
      { en: "crash", ko: "추락, 충돌, 고정" },
      { en: "meaningful", ko: "의미 있는, 중요한" },
      { en: "quarter", ko: "4분의1[15분, 25센트]" },

      { en: "abuse", ko: "남용, 오용" },
      { en: "comic", ko: "우스운, 재미있는" },
      { en: "chain", ko: "사슬" },
      { en: "guard", ko: "요원, 경비원" },
      { en: "season", ko: "양념을 하다" },
      { en: "survive", ko: "(보다 오래)살아남다" },
      { en: "accept", ko: "받아들이다" },
      { en: "insect", ko: "곤충, 벌레" },
      { en: "heal", ko: "치료하다" },
      { en: "thermometer", ko: "온도계" },

      { en: "refund", ko: "환불(하다)" },
      { en: "wheel", ko: "바퀴, 핸들" },
      { en: "correctly", ko: "올바르게" },
      { en: "vary", ko: "다르다, 다양하다, 변하다" },
      { en: "essential", ko: "필수[본질]적인" },
      { en: "crowded", ko: "붐비는" },
      { en: "beast", ko: "짐승" },
      { en: "mushroom", ko: "버섯" },
      { en: "bother", ko: "괴롭히다" },
      { en: "stress", ko: "강조(하다)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>

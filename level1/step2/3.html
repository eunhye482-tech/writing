<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "leap", ko: "뛰어오르다, 도약(하다)" },
      { en: "hug", ko: "껴안다" },
      { en: "acceptable", ko: "받아들일 수 있는" },
      { en: "series", ko: "연속" },
      { en: "label", ko: "표, 상표, 꼬리표" },
      { en: "evil", ko: "사악한" },
      { en: "ride", ko: "타다" },
      { en: "solar", ko: "태양의" },
      { en: "toward", ko: "쪽으로, 방향으로" },
      { en: "nail", ko: "손톱, 못" },

      { en: "forward", ko: "앞으로" },
      { en: "expend", ko: "들이다, 소비하다" },
      { en: "seed", ko: "씨앗" },
      { en: "century", ko: "세기" },
      { en: "period", ko: "기간, 시기" },
      { en: "recent", ko: "최근의" },
      { en: "habit", ko: "습관" },
      { en: "system", ko: "제도, 체제" },
      { en: "noble", ko: "고결한" },
      { en: "novel", ko: "소설" },

      { en: "pattern", ko: "양상, 양식, 무늬" },
      { en: "poem", ko: "시" },
      { en: "toothache", ko: "치통" },
      { en: "textbook", ko: "교과서" },
      { en: "simple", ko: "간단한" },
      { en: "helpless", ko: "무력한, 속수무책인" },
      { en: "outdoor", ko: "야외의" },
      { en: "plant", ko: "식물, 심다, 공장" },
      { en: "head", ko: "향하다, 나아가다" },
      { en: "skill", ko: "기술" },

      { en: "spirit", ko: "정신" },
      { en: "cattle", ko: "소(떼)" },
      { en: "sweet", ko: "달콤한" },
      { en: "palm", ko: "손바닥" },
      { en: "pair", ko: "한 켤레(한 쌍)" },
      { en: "press", ko: "누르다, 신문" },
      { en: "express", ko: "표현하다" },
      { en: "wooden", ko: "나무로 만든" },
      { en: "southern", ko: "남쪽의" },
      { en: "strike", ko: "(부딪)치다" },

      { en: "spring", ko: "샘" },
      { en: "soul", ko: "영혼" },
      { en: "nation", ko: "국가" },
      { en: "paradise", ko: "천국, 낙원" },
      { en: "familiar", ko: "익숙한" },
      { en: "pretty", ko: "꽤, 매우" },
      { en: "propose", ko: "제안하다" },
      { en: "average", ko: "평균" },
      { en: "passenger", ko: "승객" },
      { en: "shade", ko: "그늘" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
